<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-O</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- //or -->
<!-- <script src="https://unpkg.com/@supabase/supabase-js@2"></script> -->

    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <fieldset class="chat">
        
        <form id="ronaldo">
            <div class="messages"></div> <!--vai se incrementar com as mensagens dps -->
            <input type="text" id="message" placeholder="" maxlength="100"></input>
            <button type="submit" id="send">Enviar</button>
        </form>
    
    </fieldset>

    <fieldset class="menu">
        
        <section class="search">
            <section class="sEngine">
                <input type="text" id="busca-box"></input>
                <input type="button" value="Pesquisar" id="busca-btn"></input><br>
            </section>
            <div id="encontrado"></div><br>
        </section>
    
        <form class="chats">
            <br>
            <section class="chat-selection">
                <label for="chat1">Chat 1: <input type="radio" value="1" id="chat1" name="batepapo" required></input></label><br>
                <label for="chat2">Chat 2:<input type="radio" value="2" id="chat2" name="batepapo"></input></label><br>
                <label for="chat3">Chat 3:<input type="radio" value="3" id="chat3" name="batepapo"></input></label>
                <div id="active"></div>
            </section>

        </form>
    </fieldset>

    <script src="js/env.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
